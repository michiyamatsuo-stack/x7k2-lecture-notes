<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>どこに線を引くか</title>
<style>
  :root {
    --ink: #1A1A1A; --muted: #5F5F5F; --paper: #FFFFFF; --card: #F6F5F3;
    --accent: #B03A2E; --accent-soft: #F7E9E7; --rule: #DDDAD5; --ok: #2F5D50;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; }
  header { padding: 18px 0 8px; }
  .bar { width: 44px; height: 4px; background: var(--accent); margin-bottom: 10px; }
  h1 { font-size: 24px; line-height: 1.3; margin: 0 0 6px; letter-spacing: .02em; }
  .q { font-weight: 700; margin: 0 0 4px; }
  .inst { margin: 0; color: var(--muted); font-size: 15px; }
  .demo { margin: 10px 0 0; padding: 6px 10px; border: 1px dashed var(--rule); border-radius: 8px; font-size: 13px; color: var(--muted); }

  .end { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  .end.ok { color: var(--ok); }
  .end.ng { color: var(--accent); margin: 6px 0 0; }

  #list { list-style: none; margin: 0; padding: 0; position: relative; }
  #list li {
    display: flex; align-items: stretch; gap: 8px; min-height: 58px;
    background: var(--card); border-radius: 10px; margin: 0 0 6px;
    border-left: 5px solid var(--ok); position: relative;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #list li.ng { border-left-color: var(--accent); background: var(--accent-soft); }
  #list li.dragging { z-index: 5; box-shadow: 0 8px 22px rgba(0,0,0,.22); transition: none; }
  #list li.settle { transition: transform .16s ease; }
  .letter { flex: none; width: 34px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; color: var(--accent); padding-left: 4px; }
  .text { flex: 1; align-self: center; padding: 8px 0; font-weight: 600; font-size: 15px; line-height: 1.4; }
  .updown { flex: none; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .updown button {
    width: 36px; height: 26px; border: 1px solid var(--rule); background: #fff; color: var(--ink);
    border-radius: 6px; font-size: 12px; line-height: 1; padding: 0; cursor: pointer;
  }
  .updown button:disabled { opacity: .3; }
  .handle {
    flex: none; width: 46px; display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: grab; color: var(--muted); border-radius: 0 10px 10px 0;
  }
  .handle svg { pointer-events: none; }
  #list li.line {
    background: var(--accent); color: #fff; border-left-color: var(--accent); min-height: 46px;
  }
  #list li.line .text { text-align: center; font-size: 15px; font-weight: 800; letter-spacing: .04em; }
  #list li.line .letter { color: #fff; font-size: 16px; }
  #list li.line .handle { color: #fff; }
  #list li.line .updown button { border-color: rgba(255,255,255,.6); background: transparent; color: #fff; }

  .hint { margin: 12px 0 0; padding: 8px 12px; border: 1px solid var(--accent); border-radius: 10px; font-size: 14px; }
  label.reason { display: block; margin: 16px 0 6px; font-weight: 700; font-size: 15px; }
  label.reason span { font-weight: 400; color: var(--muted); }
  #reason { width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #9A9690; border-radius: 10px; background: #fff; color: var(--ink); }
  #send {
    display: block; width: 100%; margin: 16px 0 0; padding: 14px; font: inherit; font-weight: 800; font-size: 17px;
    color: #fff; background: var(--ink); border: 0; border-radius: 12px; cursor: pointer;
  }
  #send:disabled { opacity: .5; }
  #status { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; font-size: 15px; display: none; }
  #status.done { display: block; background: #E9F1EE; color: #1F4438; }
  #status.err { display: block; background: var(--accent-soft); color: #7C241B; }
  #status b { font-size: 17px; letter-spacing: .06em; }
  :focus-visible { outline: 3px solid #2B6CB0; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <div class="bar"></div>
    <h1 id="title"></h1>
    <p class="q" id="question"></p>
    <p class="inst" id="instruction"></p>
    <p class="demo" id="demo" hidden>試作モード：回答はこの端末の中だけに保存されます。</p>
  </header>

  <div class="end ok">▲ 許せる</div>
  <ul id="list" aria-label="カードの並び。上が許せる、下が許せない"></ul>
  <div class="end ng">▼ 許せない</div>

  <p class="hint" id="hint"></p>

  <div id="reasonBox" hidden>
    <label class="reason" for="reason">線をそこに引いた理由を、ひとことで <span>（任意・60字まで）</span></label>
    <input id="reason" type="text" maxlength="60" autocomplete="off" enterkeyhint="done">
  </div>

  <button id="send" type="button">この並びで提出する</button>
  <div id="status" role="status" aria-live="polite"></div>
</main>

<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.LINE_APP;
  var LINE = "|";
  var KEY = "lineapp:" + CFG.session;
  var list = document.getElementById("list");
  var sendBtn = document.getElementById("send");
  var statusBox = document.getElementById("status");
  var reasonInput = document.getElementById("reason");
  var cardText = {};
  CFG.cards.forEach(function (c) { cardText[c.id] = c.text; });

  document.getElementById("title").textContent = CFG.title;
  document.title = CFG.title;
  document.getElementById("question").textContent = CFG.question;
  document.getElementById("instruction").textContent = CFG.instruction;
  document.getElementById("hint").textContent = CFG.hint;
  if (!CFG.endpoint) document.getElementById("demo").hidden = false;
  if (CFG.rehearsal) { var dm = document.getElementById("demo"); dm.textContent = "リハーサル用のページです（本番の集計には入りません）。"; dm.hidden = false; }
  if (CFG.askReason) document.getElementById("reasonBox").hidden = false;

  // ---- 状態（端末に保存。再読み込みしても並びが残る） ----
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function newId() {
    var a = new Uint8Array(9);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  function shuffled(ids) {
    var a = ids.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function validOrder(o) {
    if (!Array.isArray(o) || o.length !== CFG.cards.length + 1) return false;
    var want = CFG.cards.map(function (c) { return c.id; }).concat([LINE]).sort().join("");
    return o.slice().sort().join("") === want;
  }
  var state = load();
  if (!state || !validOrder(state.order)) {
    // 最初の並びは人によって違う（順番の影響をならす）。線は一番下に置く。
    state = { id: newId(), order: shuffled(CFG.cards.map(function (c) { return c.id; })).concat([LINE]),
              touchedLine: false, touchedCards: false, submitted: null, reason: "" };
  }
  reasonInput.value = state.reason || "";

  // ---- 描画 ----
  var GRIP = '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
  function makeItem(id) {
    var li = document.createElement("li");
    li.dataset.id = id;
    var isLine = id === LINE;
    if (isLine) li.className = "line";
    var letter = document.createElement("div"); letter.className = "letter"; letter.textContent = isLine ? "" : id;
    var text = document.createElement("div"); text.className = "text";
    text.textContent = isLine ? "ここから先は、だめ" : cardText[id];
    var ud = document.createElement("div"); ud.className = "updown";
    var name = isLine ? "線" : "カード" + id;
    var up = document.createElement("button"); up.type = "button"; up.textContent = "▲"; up.setAttribute("aria-label", name + "を上へ");
    var dn = document.createElement("button"); dn.type = "button"; dn.textContent = "▼"; dn.setAttribute("aria-label", name + "を下へ");
    up.addEventListener("click", function () { step(li, -1); });
    dn.addEventListener("click", function () { step(li, 1); });
    ud.appendChild(up); ud.appendChild(dn);
    var h = document.createElement("div"); h.className = "handle"; h.innerHTML = GRIP;
    h.setAttribute("aria-hidden", "true");
    li.appendChild(letter); li.appendChild(text); li.appendChild(ud); li.appendChild(h);
    bindDrag(li, h);
    return li;
  }
  state.order.forEach(function (id) { list.appendChild(makeItem(id)); });

  function items() { return Array.prototype.slice.call(list.children); }
  function refresh() {
    var below = false;
    var its = items();
    its.forEach(function (li, i) {
      if (li.dataset.id === LINE) { below = true; }
      else li.classList.toggle("ng", below);
      var b = li.querySelectorAll(".updown button");
      b[0].disabled = i === 0; b[1].disabled = i === its.length - 1;
    });
    state.order = its.map(function (li) { return li.dataset.id; });
    save();
  }
  function touched(li) {
    if (li.dataset.id === LINE) state.touchedLine = true; else state.touchedCards = true;
    if (state.submitted) markDirty();
  }
  function step(li, dir) {
    var sib = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
    if (!sib) return;
    if (dir < 0) list.insertBefore(li, sib); else list.insertBefore(sib, li);
    touched(li); refresh();
    var btn = li.querySelectorAll(".updown button")[dir < 0 ? 0 : 1];
    (btn.disabled ? li.querySelectorAll(".updown button")[dir < 0 ? 1 : 0] : btn).focus();
  }

  // ---- ドラッグ（つまみを押さえて上下に動かす） ----
  // 動かしている行そのものはDOMから外さず、まわりの行を入れ替える（ポインターの捕捉が切れないように）。
  var drag = null;
  function bindDrag(li, h) {
    h.addEventListener("pointerdown", function (e) {
      if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
      e.preventDefault();
      var listTop = list.getBoundingClientRect().top;
      drag = { li: li, h: h, pid: e.pointerId, grab: e.clientY - listTop - li.offsetTop, y: e.clientY, moved: false, raf: 0 };
      try { h.setPointerCapture(e.pointerId); } catch (err) {}
      li.classList.remove("settle"); li.classList.add("dragging");
      drag.raf = requestAnimationFrame(tick);
    });
    h.addEventListener("pointermove", function (e) {
      if (!drag || drag.li !== li || e.pointerId !== drag.pid) return;
      e.preventDefault(); drag.y = e.clientY; place();
    });
    function end(e) {
      if (!drag || drag.li !== li || e.pointerId !== drag.pid) return;
      cancelAnimationFrame(drag.raf);
      var moved = drag.moved; drag = null;
      li.classList.remove("dragging"); li.classList.add("settle"); li.style.transform = "";
      if (moved) touched(li);
      refresh();
    }
    h.addEventListener("pointerup", end);
    h.addEventListener("pointercancel", end);
    h.addEventListener("lostpointercapture", end);
  }
  function place() {
    var li = drag.li, h = li.offsetHeight;
    var listRect = list.getBoundingClientRect();
    var top = drag.y - listRect.top - drag.grab;
    top = Math.max(-4, Math.min(list.offsetHeight - h + 4, top));
    var centre = top + h / 2, guard = 0;
    while (guard++ < 20) {
      var prev = li.previousElementSibling, next = li.nextElementSibling;
      if (prev && centre < prev.offsetTop + prev.offsetHeight / 2) { slide(prev, function () { list.insertBefore(prev, li.nextSibling); }); drag.moved = true; }
      else if (next && centre > next.offsetTop + next.offsetHeight / 2) { slide(next, function () { list.insertBefore(next, li); }); drag.moved = true; }
      else break;
    }
    li.style.transform = "translateY(" + (top - li.offsetTop) + "px)";
  }
  function slide(el, move) {            // 入れ替わる行を、すっと動かす
    var before = el.offsetTop; move(); var d = before - el.offsetTop;
    el.classList.remove("settle"); el.style.transform = "translateY(" + d + "px)";
    void el.offsetHeight;
    el.classList.add("settle"); el.style.transform = "";
  }
  function tick() {                     // 画面の端まで持っていったら、ページを送る
    if (!drag) return;
    var edge = 64, speed = 0;
    if (drag.y < edge) speed = -Math.ceil((edge - drag.y) / 6);
    else if (drag.y > window.innerHeight - edge) speed = Math.ceil((drag.y - (window.innerHeight - edge)) / 6);
    if (speed) { window.scrollBy(0, speed); place(); }
    drag.raf = requestAnimationFrame(tick);
  }

  // ---- 提出 ----
  function summary(order) {
    var s = "";
    order.forEach(function (id) { s += id === LINE ? "｜" : id + " "; });
    return s.replace(/ ｜/, "｜").trim();
  }
  function show(kind, html) { statusBox.className = kind; statusBox.innerHTML = html; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function markDirty() {
    sendBtn.textContent = "並べ直した内容で、もう一度提出する";
    show("done", "前に提出した並び：<b>" + esc(summary(state.submitted)) + "</b><br>並びを変えました。もう一度「提出」を押すと、新しい並びに置き換わります。");
  }
  function markDone() {
    sendBtn.textContent = "並べ直して、もう一度提出する";
    show("done", "提出しました。ありがとうございます。<br>あなたの並び：<b>" + esc(summary(state.submitted)) + "</b><br>（｜が「ここから先はだめ」の線です）");
  }
  if (state.submitted) markDone();

  function post(payload, attempt) {
    if (!CFG.endpoint) {                 // 試作モード：端末の中に保存
      var k = "lineapp-demo:" + CFG.session, rows;
      try { rows = JSON.parse(localStorage.getItem(k)) || {}; } catch (e) { rows = {}; }
      rows[payload.id] = { o: payload.order, l: payload.line, r: payload.reason };
      localStorage.setItem(k, JSON.stringify(rows));
      return Promise.resolve();
    }
    return fetch(CFG.endpoint, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error((j && j.error) || "error"); })
      .catch(function (err) {
        if (attempt >= 3) throw err;
        return new Promise(function (res) { setTimeout(res, 800 * attempt + Math.random() * 600); })
          .then(function () { return post(payload, attempt + 1); });
      });
  }
  reasonInput.addEventListener("input", function () { state.reason = reasonInput.value; save(); if (state.submitted) markDirty(); });
  sendBtn.addEventListener("click", function () {
    refresh();
    if (!state.touchedLine && !state.submitted) {
      if (!window.confirm("赤い線をまだ動かしていません。\nこの位置（" + summary(state.order) + "）で提出しますか？")) return;
    }
    var order = state.order.slice();
    var line = order.indexOf(LINE);
    var payload = { session: CFG.session, id: state.id, order: order.filter(function (x) { return x !== LINE; }).join(""),
                    line: line, reason: CFG.askReason ? reasonInput.value.trim().slice(0, 60) : "" };
    sendBtn.disabled = true; var label = sendBtn.textContent; sendBtn.textContent = "送っています…";
    post(payload, 1).then(function () {
      state.submitted = order; save(); sendBtn.disabled = false; markDone();
    }).catch(function () {
      sendBtn.disabled = false; sendBtn.textContent = label;
      show("err", "うまく送れませんでした。電波のよいところで、もう一度「提出」を押してください。");
    });
  });

  refresh();
})();
</script>
</body>
</html>
